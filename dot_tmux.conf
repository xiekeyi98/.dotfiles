# 禁止程序自动改 window 名
set-window-option -g automatic-rename off
set-window-option -g allow-rename off

# 终端窗口标题：显示 会话名/窗口名
set -g set-titles on
set -g set-titles-string "#S/#W"

# 推荐：和 iTerm2 -CC 协议配合更稳
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 鼠标支持
set -g mouse on

# 加大 history
set -g history-limit 50000

# ── 分屏快捷键 ────────────────────────────────────────
# | 左右分屏、- 上下分屏，新 pane 继承当前目录
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# prefix + r 重新加载本配置
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── 状态栏美化 ────────────────────────────────────────
# 整体配色：深灰底 + 浅灰字，时钟每 5 秒刷新
set -g status-style "bg=colour235,fg=colour250"
set -g status-interval 5

# 左侧：会话名
set -g status-left "#[bg=colour39,fg=colour235,bold] #S #[default] "
set -g status-left-length 30

# 右侧：日期 + 时间 + 主机名
set -g status-right "#[fg=colour244]%Y-%m-%d #[fg=colour250]%H:%M #[bg=colour39,fg=colour235,bold] #H "
set -g status-right-length 60

# 窗口列表：当前窗口高亮
setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=colour250"
setw -g window-status-current-format " #I:#W "
setw -g window-status-current-style "bg=colour39,fg=colour235,bold"

# pane 边框：激活的那条更醒目
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"

# ── 会话快照：每小时自动保存，按需手动恢复 ─────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '60'
set -g @continuum-restore 'off'

# TPM 入口保持在配置末尾，避免后续 status-right 配置覆盖 continuum hook
run '~/.tmux/plugins/tpm/tpm'
